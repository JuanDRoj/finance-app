# Alembic configuration. The database is NOT configured here: migrations/env.py reads the
# same settings as the app (DATABASE_URL, or the Cloud SQL Connector variables).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# Keep generated revisions lint-clean and formatted.
[post_write_hooks]
hooks = ruff_check, ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

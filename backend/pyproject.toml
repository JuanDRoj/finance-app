[project]
name = "finance-backend"
version = "0.1.0"
description = "Personal Finance App - backend API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cloud-sql-python-connector[asyncpg]>=1.22.0",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "tests"]
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; tests use it directly to fake the Cloud SQL Connector.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

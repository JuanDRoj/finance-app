# Prueba de humo de Workload Identity Federation GitHub -> GCP (KAN-12).
#
# Se comprueba a sí misma en las dos direcciones, según la ref desde la que corre.
#
# Ojo con cómo funciona la action `google-github-actions/auth` sin `token_format`: solo pide el token
# OIDC a GitHub y escribe un archivo de credenciales external_account; NO llama a STS ni a IAM
# Credentials. El intercambio real ocurre cuando gcloud usa esas credenciales. Por eso el rechazo por
# la condición del provider no aparece en el step `auth`, sino al pedir un token con gcloud.
#
#   - Desde `main`: `auth` debe terminar bien y las lecturas de Artifact Registry y Cloud Run (que sí
#     fuerzan el intercambio) deben responder: prueba que la condición deja pasar a main y que los
#     roles de github-deployer-stg están bien. VERDE = main se autentica y lee; ROJO = cualquier fallo.
#   - Desde cualquier otra ref (rama, PR, tag): `auth` debe terminar bien (obtiene el token OIDC) y
#     después `gcloud auth print-access-token` debe FALLAR con el rechazo de STS por la condición
#     (`unauthorized_client` + "attribute condition"). VERDE = rechazo por la condición confirmado.
#     ROJO = (a) el token se obtuvo (la condición no restringe refs) o (b) no se pudo probar: `auth`
#     falló (p. ej. PR de un fork, que no recibe id-token) o el intercambio falló por otro motivo
#     (red, STS caído, provider mal escrito). Nunca hay verde sin haber visto el rechazo exacto.
#
# Triggers:
#   - workflow_dispatch: manual. `gh workflow run wif-smoke.yml --ref main` prueba el caso positivo;
#     con `--ref <otra-rama>` (el archivo debe existir en esa rama) prueba el negativo.
#   - pull_request solo cuando el PR toca este archivo: ahí el ref es refs/pull/N/merge, así que el
#     PR que modifica el workflow demuestra el caso negativo antes de mergear. No es un check requerido.
#
# Las variables GCP_WIF_PROVIDER y GCP_DEPLOYER_SA son variables de repo (no secretos): las escribe
# infra/scripts/30_workload_identity.sh con SET_GH_VARS=1.
name: WIF smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wif-smoke.yml"

# id-token: write es lo mínimo para pedir el token OIDC; contents: read para no heredar más.
permissions:
  contents: read
  id-token: write

concurrency:
  group: wif-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: kanza-stg
  GCP_REGION: southamerica-east1
  AR_REPOSITORY: finance-stg

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECT_AUTH: ${{ github.ref == 'refs/heads/main' && 'allow' || 'deny' }}
    steps:
      - name: Expected result
        run: echo "ref=${GITHUB_REF} expected authentication=${EXPECT_AUTH}"

      # Sin las variables, un rechazo fuera de main sería un falso positivo (fallaría por otra razón).
      - name: Check repo variables are set
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
        run: |
          if [[ -z "${WIF_PROVIDER}" || -z "${DEPLOYER_SA}" ]]; then
            echo "::error::Repo variables GCP_WIF_PROVIDER and GCP_DEPLOYER_SA must be set (infra/scripts/30_workload_identity.sh with SET_GH_VARS=1)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        # Sin token_format: la action solo obtiene el token OIDC de GitHub y escribe el archivo de
        # credenciales; no llama a STS. Fuera de main el fallo de este step se evalúa a mano en el
        # siguiente (continue-on-error evita el rojo automático para dar un mensaje preciso).
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # Fuera de main: sin credenciales no hay prueba posible (p. ej. un PR de un fork no recibe
      # id-token). Eso es ROJO ("no se pudo probar"), nunca verde.
      - name: Assert credentials were produced (not main)
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          if [[ "${AUTH_OUTCOME}" != "success" ]]; then
            echo "::error::Could not test: the auth step ended with '${AUTH_OUTCOME}' (it should only fetch the GitHub OIDC token and write the credentials file). Forks do not receive id-token."
            exit 1
          fi
          echo "OK: credentials file written; now forcing the STS exchange."

      # Fuera de main: el intercambio real (STS) ocurre aquí y DEBE ser rechazado por la condición del
      # provider. El token nunca se imprime (stdout a /dev/null). Texto del rechazo de STS, tal como lo
      # documentan muchos reportes públicos (no lo pude confirmar en la documentación oficial de Google):
      #   {"error":"unauthorized_client","error_description":"The given credential is rejected by the attribute condition."}
      # gcloud lo envuelve en su propio mensaje, así que se busca `unauthorized_client` y
      # `attribute condition` por separado, sin distinguir mayúsculas.
      - name: Assert STS rejects the exchange (not main)
        if: ${{ github.ref != 'refs/heads/main' && success() }}
        run: |
          err_file="${RUNNER_TEMP}/sts-exchange.err"
          if gcloud auth print-access-token --project="${GCP_PROJECT_ID}" >/dev/null 2>"${err_file}"; then
            echo "::error::A token was issued outside main: the provider condition does not restrict refs."
            exit 1
          fi
          if grep -qi 'unauthorized_client' "${err_file}" && grep -qi 'attribute condition' "${err_file}"; then
            echo "OK: STS rejected the exchange by the attribute condition, as expected."
          else
            echo "::error::Could not test: the exchange failed, but not with the attribute-condition rejection (network, STS, provider name?). gcloud error follows (no tokens):"
            head -c 2000 "${err_file}"
            exit 1
          fi

      # En main: las credenciales deben ser de federación (external_account), nunca una llave de cuenta de servicio.
      - name: Assert federated credentials (main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          cred_type="$(jq -r '.type' "${GOOGLE_GHA_CREDS_PATH}")"
          if [[ "${cred_type}" != "external_account" ]]; then
            echo "::error::Credential file type is '${cred_type}', expected external_account."
            exit 1
          fi
          echo "OK: credential type is external_account (no key file)."

      - name: Show the authenticated identity (main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: gcloud auth list --filter=status:ACTIVE --format='value(account)'

      # Lecturas que ejercitan los roles del deployer (artifactregistry.writer y run.admin).
      - name: Read Artifact Registry repository (main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: gcloud artifacts repositories describe "${AR_REPOSITORY}" --location="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(name)'

      - name: List Cloud Run services (main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: gcloud run services list --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" --format='value(metadata.name)'

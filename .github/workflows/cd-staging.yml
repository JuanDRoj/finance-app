# CD a staging en cada merge a `main` (KAN-16, INF-10).
#
# Flujo: construir la imagen (etiqueta = SHA de 12 caracteres) -> subirla a Artifact Registry ->
# infra/scripts/cd_deploy.sh (job de migraciones con esa imagen -> revisión nueva SIN tráfico ->
# smoke test -> mover el tráfico -> smoke público). La lógica del despliegue vive en el script para
# poder probarla en local antes del merge: la condición de WIF solo deja entrar a `main`.
#
# El disparador tiene que ser `push` (o `workflow_dispatch`): el provider WIF rechaza cualquier otro
# evento, por ejemplo un `workflow_run` tras el CI. `workflow_dispatch` sirve para volver a desplegar
# `main` a mano, por ejemplo después de encender Cloud SQL (`gh workflow run cd-staging.yml --ref main`).
#
# Sin secretos: las variables de repo GCP_WIF_PROVIDER y GCP_DEPLOYER_SA no lo son (las escribe
# infra/scripts/30_workload_identity.sh) y no hay llaves de cuentas de servicio.
name: CD staging

on:
  push:
    branches: [main]
    # Un merge que solo toca documentación o frontend no crea una revisión inútil. Si cambias la lista,
    # actualiza también infra/CLAUDE.md.
    paths:
      - "backend/**"
      - ".github/workflows/cd-staging.yml"
      - "infra/scripts/cd_deploy.sh"
      - "infra/env/staging.env"
      - "infra/scripts/lib.sh"
  workflow_dispatch:

# id-token: write es lo mínimo para pedir el token OIDC; contents: read para el checkout.
permissions:
  contents: read
  id-token: write

# Un solo despliegue a la vez y nunca se corta uno a la mitad. Si llegan varios merges seguidos,
# GitHub conserva solo el más nuevo en espera: se despliega el último estado de main.
concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: kanza-stg
  GCP_REGION: southamerica-east1
  AR_REPOSITORY: finance-stg
  IMAGE_NAME: finance-api

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    # Criterio de KAN-16: del merge a la revisión nueva en menos de 15 minutos.
    timeout-minutes: 15
    steps:
      # Sin las variables, la autenticación fallaría con un mensaje poco claro.
      - name: Check repo variables are set
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOYER_SA == '' }}
        run: |
          echo "::error::Repo variables GCP_WIF_PROVIDER and GCP_DEPLOYER_SA must be set (infra/scripts/30_workload_identity.sh with SET_GH_VARS=1)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: meta
        run: |
          short="${GITHUB_SHA::12}"
          echo "tag=${short}" >> "$GITHUB_OUTPUT"
          echo "image_path=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      # Ayudante de credenciales de Docker basado en gcloud: no escribe ningún token en el archivo.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Mismos ajustes que infra/scripts/cloud_run_image.sh: linux/amd64 (la arquitectura de Cloud Run)
      # y sin atestaciones de BuildKit (manifiesto de imagen simple, no una lista de manifiestos).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cd-backend
          cache-to: type=gha,mode=max,scope=cd-backend

      # Migraciones, revisión sin tráfico, smoke y traspaso del tráfico. Se despliega por digest: no
      # cambia aunque alguien vuelva a subir la misma etiqueta.
      - name: Deploy to staging
        env:
          IMAGE: ${{ steps.meta.outputs.image_path }}@${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: bash infra/scripts/cd_deploy.sh

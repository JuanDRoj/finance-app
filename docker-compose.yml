# Entorno local: PostgreSQL + emulador de Firebase Auth.
# Backend (uv run) y frontend (npm run dev) corren fuera de compose.
name: finance-app

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_dev}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    ports:
      # Solo en loopback: la BD no queda expuesta a la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
      # Crea la BD finance_test (solo con el volumen vacio).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  firebase-emulator:
    build:
      context: ./infra/firebase-emulator
    image: finance-firebase-emulator:local
    container_name: finance-firebase-emulator
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_EMULATOR_PROJECT_ID:-demo-finance-local}
    ports:
      - "127.0.0.1:${FIREBASE_AUTH_EMULATOR_PORT:-9099}:9099"
      - "127.0.0.1:${FIREBASE_EMULATOR_UI_PORT:-4000}:4000"
    healthcheck:
      # node ya esta en la imagen: evita instalar curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  finance_pgdata:
